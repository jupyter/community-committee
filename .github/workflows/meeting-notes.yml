name: "Setup / sync meeting notes"

on:
  # Generate notes every Thursday before the meeting
  schedule:
    - cron: "0 5 * * 4"

  workflow_dispatch:
    inputs:
      kind:
        type: "choice"
        description: "What kind of meeting?"
        default: "core"
        options:
          - "core"
      date:
        description: |
          Date of the meeting in `date --date` format, e.g.:
          "today", "tomorrow", "next wednesday", "2025-02-05", etc.
          See <https://www.gnu.org/software/coreutils/manual/html_node/Date-input-formats.html>
        required: false
        default: "today"
        type: "string"
      force:
        description: |
          Create the notes PR even if another notes PR is already open.
        required: false
        default: false
        type: "boolean"

  issue_comment:  # TODO: Switch to issue comment?
    types:
      - "created"
      - "edited"


# IMPORTANT: Enable 'Allow GitHub Actions to create and approve pull requests'
# in repo and organization Actions Settings.
permissions:
  contents: "write"
  pull-requests: "write"


jobs:
  setup:
    name: "Resolve inputs and check for an already-open meeting notes PR"
    if: "github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'"
    runs-on: "ubuntu-latest"
    # Set default parameters for below (`inputs` is null for scheduled runs).
    env:
      KIND: "${{ inputs.kind || 'core' }}"
      DATE: "${{ inputs.date || 'today' }}"
      FORCE: "${{ inputs.force || false }}"
    outputs:
      kind: "${{ env.KIND }}"
      date: "${{ env.DATE }}"
      should_create: "${{ steps.check.outputs.should_create }}"
    steps:
      - name: "Look for an open meeting notes PR"
        id: "check"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          # Only one notes PR per kind should be open at a time to prevent PRs from piling up.
          # We check for existing PRs by looking branches like YYYY-MM-DD-<kind>-meeting-notes.
          open_prs="$(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --state "open" \
              --limit 100 \
              --json "number,headRefName,isCrossRepository" \
              --jq '[
                .[]
                | select(.isCrossRepository | not)
                | select(.headRefName | test("-" + env.KIND + "-meeting-notes$"))
                | .number | tostring
              ] | join(", ")'
          )"
          echo "Open ${KIND} meeting notes PRs: ${open_prs:-<none>}"

          if [ -z "${open_prs}" ]; then
            echo "should_create=true" >> "${GITHUB_OUTPUT}"
          elif [ "${FORCE}" = "true" ]; then
            echo "A ${KIND} meeting notes PR is already open (${open_prs}), but force was requested." \
              >> "${GITHUB_STEP_SUMMARY}"
            echo "should_create=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Skipping: a ${KIND} meeting notes PR is already open (${open_prs})." \
              >> "${GITHUB_STEP_SUMMARY}"
            echo "should_create=false" >> "${GITHUB_OUTPUT}"
          fi

  create:
    name: "Create PR for meeting notes"
    needs:
      - "setup"
    if: "needs.setup.outputs.should_create == 'true'"
    uses: "mfisher87/hackmd-meeting-notes-action/.github/workflows/create-meeting-notes-pr.yml@main"
    with:
      date: "${{ needs.setup.outputs.date }}"
      template_path: ".github/meeting-notes-templates/${{ needs.setup.outputs.kind }}.md"
      # TODO: Is this the HackMD path or the repo path??
      output_path: "meeting-notes/%Y%m%d-${{ needs.setup.outputs.kind }}/index.md"
      hackmd_team: "jupyter-community"
      branch_name: "%Y-%m-%d-${{ needs.setup.outputs.kind }}-meeting-notes"
      force_push: true
      pr_title: "Add ${{ needs.setup.outputs.kind }} meeting notes %Y-%m-%d"
      pr_body: |
        Meeting notes initialized at ${env.hackmd_doc_url}.

        After the meeting, sync the notes from HackMD to this PR by commenting:

        ```
        /bot please sync notes
        ```
    secrets:
      HACKMD_TOKEN: "${{ secrets.HACKMD_TOKEN }}"

  sync-comment-trigger:
    name: "React to the triggering comment"
    if: "${{ github.event.issue.pull_request && contains(github.event.comment.body, '/bot please sync notes') }}"
    runs-on: "ubuntu-latest"
    steps:
      - name: "React to the triggering comment"
        run: |
          gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions --raw-field 'content=+1'
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  sync:
    name: "Sync notes from HackMD to PR"
    needs:
     - "sync-comment-trigger"
    uses: "mfisher87/hackmd-meeting-notes-action/.github/workflows/sync-meeting-notes-pr.yml@main"
    with:
      pr_number: "${{ github.event.issue.number }}"
    secrets:
      HACKMD_TOKEN: "${{ secrets.HACKMD_TOKEN }}"
